# ---------------------------------------------------------------------------
#  SeedFi — servidor del frontend
# ---------------------------------------------------------------------------
#  Dos responsabilidades, y ninguna de las dos es opcional:
#
#  1. LAS CABECERAS COOP/COEP. Barretenberg genera la prueba en varios hilos y
#     se los comunica con `SharedArrayBuffer`, que solo existe en un contexto
#     con aislamiento de origen cruzado. Sin estas dos cabeceras el navegador
#     lo deja en `undefined` y bb.js falla al inicializar sin decir por qué.
#     Es exactamente lo que hace `server.headers` de vite.config.ts en dev.
#
#  2. EL PROXY A /api. Con COEP en `require-corp`, una respuesta de otro origen
#     sin CORP queda bloqueada. Pasando el backend por el mismo origen no hay
#     preflight de CORS ni recurso bloqueado.
#
#  `add_header` no se hereda a una `location` que declare las suyas, así que
#  las tres cabeceras se repiten en cada bloque. Es feo y es la forma correcta.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # El bundle de bb.js pesa; el WASM más. Comprimirlo cambia la primera carga.
    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length  1024;

    # El backend acepta cuerpos de 8 MB (una evidencia en base64).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Un despliegue o una tx en testnet pueden tardar bastante más que los
        # 60 s de fábrica; el que espera del otro lado es el navegador.
        proxy_read_timeout 300s;

        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    # Lo escribe `npm run seed` en el volumen de datos del backend. Solo lo usa
    # /zk-selftest.html; si todavía no corrió el seed, da 404 y esa página ya
    # explica qué hacer.
    location = /demo-credentials.json {
        alias /srv/seed/demo-credentials.json;
        add_header Cache-Control                "no-store"     always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    # Vite le pone hash al nombre a todo lo de /assets: cachear un año es seguro
    # y es lo único que hace que una recarga no vuelva a bajar el WASM.
    location /assets/ {
        # Sin `expires`: emite su propio Cache-Control y quedarían dos cabeceras.
        add_header Cache-Control                "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    # index.html NUNCA se cachea: es el que apunta a los assets con hash. Si se
    # queda pegado, el navegador sigue pidiendo un bundle que ya no existe.
    location = /index.html {
        add_header Cache-Control                "no-cache"     always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    # El enrutado es del lado del cliente: /app, /app/proyectos/… no son
    # archivos, y sin este fallback una recarga en cualquier ruta da 404.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }
}
